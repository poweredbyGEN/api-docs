# GEN-6697: scripts/user-job-enums.json feeds check-model-enums.mjs, so every
# documented model enum is only as true as this copy. Prove on every PR and
# main push that it is byte-identical to the Rails-generated
# docs/generated/user-job-enums.json at gen-backend-v2 main (gated derived
# there by `bin/rails user_job_enums:verify`). Runs on Woodpecker rather than
# the GitHub deploy workflow because the read credential is the Woodpecker org
# secret gen_backend_v2_read_token. A missing secret or fetch failure is red,
# never a skip. `push` is scoped to main so a PR does not run twice.
when:
  - event: pull_request
  - event: push
    branch: main

steps:
  enums-freshness:
    image: node:20-slim
    environment:
      GEN_BACKEND_V2_TOKEN:
        from_secret: gen_backend_v2_read_token
    commands:
      - node scripts/check-enums-freshness.mjs
