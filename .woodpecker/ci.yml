# GEN-6691: the documentation contract gates bind here, on Gitea, the forge
# that controls merges. The GitHub deploy workflow also runs `npm test`, but on
# a one-way mirror that lags or freezes, so a pass there proves nothing about
# main. Both steps are stdlib-only Node: no install step. `push` is scoped to
# main so a PR does not run twice, and no `path:` filter is set because a
# squash merge can match no filter and then produce no pipeline at all.
#
# model-enums (npm test): every documented generation type and model is one
#   Rails accepts, derived from the vendored scripts/backend/user-job-enums.json,
#   plus the MDX table check.
# enums-freshness (GEN-6697): that vendored copy is byte-identical to
#   gen-backend-v2 main on git.gen.pro, read with the org secret
#   gen_gitea_read_token (a Gitea read token; gen_backend_v2_read_token is a
#   GitHub PAT, which Gitea answers with 401). A missing secret or fetch
#   failure is red, never a skip.
# backend-drift: every generated region of the public docs (the OpenAPI copies,
#   llms.txt, llms-full.txt and the card reference pages) is exactly what
#   scripts/sync-from-backend.mjs renders from the vendored gen-backend-v2 and
#   gen-mcp-server artifacts, so a backend change cannot land without the docs
#   moving with it. Offline and stdlib-only: it reads scripts/backend/, which is
#   refreshed by the same script with --backend. Hand-written prose outside a
#   gen:<name> marker pair is not compared, so it stays free to edit by hand.
# publish-platforms (GEN-6715, GEN-7755): every platform the live publishing
#   rules endpoint serves has a row in the publishing page and llms-full.txt and
#   a value in the publish platform enum of both OpenAPI copies, and no doc
#   surface still names a retired publish tool. Stdlib-only Python, no install;
#   a fetch failure is red, never a skip. The MCP half of the same rule is in
#   gen-mcp-server .woodpecker/ci.yml.
# mcp-tools (GEN-6919): every gen_* name in the MCP-facing docs is served by
#   tools/list or is a retired name whose replacement the line names, and no
#   stale tool count is claimed. It reads the committed
#   scripts/mcp-tools-snapshot.json: CI has no MCP credential, so the live
#   surface is refreshed by scripts/update-mcp-tools-snapshot.mjs with a PAT.
when:
  - event: pull_request
  - event: push
    branch: main

steps:
  # The GitHub Pages publish runs `astro build`; the same build runs here so an
  # MDX page the site cannot compile fails the PR instead of the publish.
  site-build:
    image: node:20-slim
    commands:
      - npm ci --no-audit --no-fund
      - npx astro build

  model-enums:
    image: node:20-slim
    commands:
      - npm test

  enums-freshness:
    image: node:20-slim
    environment:
      GEN_BACKEND_V2_TOKEN:
        from_secret: gen_gitea_read_token
    commands:
      - node scripts/check-enums-freshness.mjs

  backend-drift:
    image: node:20-slim
    commands:
      - node scripts/sync-from-backend.mjs --check

  publish-platforms:
    image: python:3.12-slim
    commands:
      - python3 scripts/check_publish_platforms.py
  # mcp-surface: public/openapi.yaml documents exactly the backend routes an MCP
  #   tool calls. The surface, the paths region of both OpenAPI copies and the
  #   llms endpoint lists are regenerated from scripts/mcp-surface.json and the
  #   vendored contracts; the step is red on any drift, on a write without a
  #   request body, on an operation without a 2xx response schema, or on a
  #   growth of x-schema-status: missing past scripts/openapi-missing-baseline.json.
  #   Stdlib-only Python, no install.
  mcp-surface:
    image: python:3.12-slim
    commands:
      - python3 scripts/sync_mcp_surface.py --check
  # openapi-completeness (GEN-8157): public/openapi.yaml is the API reference,
  #   so every operation must give an integrator a description, a request and
  #   response shape with examples, and an error envelope. The checker scores
  #   each operation on seven dimensions and fails when any count drops below
  #   scripts/openapi-completeness-baseline.json (which --update raises, never
  #   lowers). Stdlib-only Node, no install.
  openapi-completeness:
    image: node:20-slim
    commands:
      - node scripts/check-openapi-completeness.mjs
  mcp-tools:
    image: node:20-slim
    commands:
      - node scripts/check-mcp-tools.mjs
