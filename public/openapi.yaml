  # ── Templates ─────────────────────────────────────────────
  /schedule/with-post:
    post:
      operationId: createScheduledPost
      servers:
        - url: https://python.gen.pro
      x-mcp-tool: gen_publish_action
      x-mcp-branch: "schedule_post_<platform>"
      x-phase: [export]
      summary: Publish now or schedule a post (all platforms)
      description: |
        Post content to one or more connected social accounts — TikTok, Instagram, Facebook Page, YouTube, X, LinkedIn — immediately (`schedule_type: now`), at a time (`specific_time`), or in the agent's next free calendar slot (`next_available`, default). Instagram takes 2-10 items as a carousel (optional `instagram_music`), YouTube uploads `thumbnail_url` and takes `youtube_options` (visibility, shorts, tags, ...), LinkedIn takes a PDF/PPTX/DOCX document or up to 9 images and `linkedin_options` (visibility, alt_text).

        The request is validated per platform before anything is queued (media type and count, caption/title limits, required fields such as the YouTube title); a violation is a `422 platform_validation_failed` naming the platform and field. Publishing is asynchronous even for `now`: a `200` means accepted and queued. Poll `GET /schedule/post/{post_id}` for the per-platform outcome and the live `post_url`.

        The agent must have connected each target platform first (GEN app → Setup → Accounts).
      tags: [Publishing]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Any string up to 128 characters, unique per agent. A retry with the same key returns the original post (`idempotent_replay: true`) instead of creating a duplicate.
          schema:
            type: string
            maxLength: 128
        - name: X-Timezone-Offset
          in: header
          required: false
          description: Local UTC offset in hours (e.g. `-7`) used to render times in the response. Defaults to the agent's time zone.
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePostRequest'
            examples:
              youtubeNow:
                summary: YouTube video, now
                value:
                  agent_id: "agent_abc123"
                  platform: [youtube]
                  schedule_type: now
                  media_url: "https://cdn.gen.pro/outputs/render_xyz.mp4"
                  title: "Factory price reveal"
                  description: "What your $12 beauty sponge really costs."
                  strict: true
              linkedinText:
                summary: LinkedIn, text only
                value:
                  agent_id: "agent_abc123"
                  platform: [linkedin]
                  schedule_type: now
                  description: "Three things we learned shipping our publishing API this week..."
                  strict: true
              xThread:
                summary: X thread
                value:
                  agent_id: "agent_abc123"
                  platform: [x]
                  schedule_type: now
                  thread:
                    - text: "1/ Here is a thread about our launch."
                    - text: "2/ With a screenshot"
                      media_urls: ["https://cdn.example.com/shot.jpg"]
                    - text: "3/ Wrapping up."
              instagramCarousel:
                summary: Instagram carousel with auto music
                value:
                  agent_id: "agent_abc123"
                  platform: [instagram]
                  schedule_type: now
                  media_url: "https://cdn.gen.pro/outputs/clip_1.mp4"
                  media_urls: ["https://cdn.gen.pro/outputs/still_2.jpg", "https://cdn.gen.pro/outputs/still_3.png"]
                  description: "Three looks, one drop #carousel"
                  instagram_music: { mode: auto }
                  strict: true
              youtubeShort:
                summary: YouTube Short with a custom thumbnail
                value:
                  agent_id: "agent_abc123"
                  platform: [youtube]
                  schedule_type: now
                  media_url: "https://cdn.gen.pro/outputs/render_xyz.mp4"
                  thumbnail_url: "https://cdn.gen.pro/outputs/cover.jpg"
                  title: "Factory price reveal"
                  youtube_options: { visibility: public, shorts: true, tags: [sourcing, beauty] }
                  strict: true
              linkedinDocument:
                summary: LinkedIn PDF document, connections only
                value:
                  agent_id: "agent_abc123"
                  platform: [linkedin]
                  schedule_type: now
                  media_url: "https://cdn.gen.pro/outputs/q3-deck.pdf"
                  title: "Q3 in ten slides"
                  description: "Our Q3 numbers, one slide at a time."
                  linkedin_options: { visibility: connections }
                  strict: true
              multiScheduled:
                summary: One video to several platforms, scheduled
                value:
                  agent_id: "agent_abc123"
                  platform: [tiktok, instagram, youtube, x, linkedin]
                  schedule_type: specific_time
                  scheduled_time: "2026-09-20T15:00:00Z"
                  media_url: "https://cdn.gen.pro/outputs/render_xyz.mp4"
                  title: "Factory price reveal"
                  description: "What your $12 beauty sponge really costs. #sourcing"
                  tiktok_privacy_level: PUBLIC_TO_EVERYONE
                  tiktok_disable_comment: false
                  tiktok_disable_duet: false
                  tiktok_disable_stitch: false
      responses:
        '200':
          description: Accepted and queued (or replayed for a matching Idempotency-Key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: A platform would reject this content, or the body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformValidationError'
              example:
                detail:
                  error: "YouTube requires a title"
                  error_code: platform_validation_failed
                  platform: youtube
                  field: title
                  errors:
                    - platform: youtube
                      field: title
                      error: "YouTube requires a title"

