  # gen:mcp-surface-paths:end
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Personal Access Token (PAT). Create one in Settings > API Keys.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT issued by the GEN dashboard sign-in.

  parameters:
    AgentId:
      name: agent_id
      in: query
      required: true
      description: The agent ID. Find via `GET /v1/agents`.
      schema:
        type: string
    AgentIdPath:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
    SheetId:
      name: sheet_id
      in: path
      required: true
      schema:
        type: string
    RowId:
      name: row_id
      in: path
      required: true
      schema:
        type: string
    CellId:
      name: cell_id
      in: path
      required: true
      schema:
        type: string
    LayerId:
      name: layer_id
      in: path
      required: true
      schema:
        type: string
    TokenId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    TranscriptionSource:
      type: object
      required: [value]
      properties:
        value:
          type: string
          format: uri
          description: Publicly reachable URL of the media to transcribe.
          example: "https://cdn.example.com/episode-12.mp3"
        key:
          type: string
          description: Optional storage key for the media.

    TranscriptionTrim:
      type: object
      required: [start_seconds, duration_seconds]
      description: Transcribe only part of the source.
      properties:
        start_seconds:
          type: number
          minimum: 0
          description: Offset to start transcribing from.
          example: 15
        duration_seconds:
          type: number
          exclusiveMinimum: 0
          description: How many seconds to transcribe.
          example: 30

    TranscriptionData:
      type: object
      description: |
        The source to transcribe. Pass exactly one of `audio`, `video`, or
        `content_resource_id`. `audio` and `video` are mutually exclusive;
        `trim` may accompany either.
      oneOf:
        - type: object
          required: [audio]
          additionalProperties: false
          properties:
            audio:
              $ref: '#/components/schemas/TranscriptionSource'
            trim:
              $ref: '#/components/schemas/TranscriptionTrim'
        - type: object
          required: [video]
          additionalProperties: false
          properties:
            video:
              $ref: '#/components/schemas/TranscriptionSource'
            trim:
              $ref: '#/components/schemas/TranscriptionTrim'
        - type: object
          required: [content_resource_id]
          properties:
            content_resource_id:
              type: string
              description: ID of an audio or video content resource already uploaded to the agent.
              example: "res_abc123"

    TranscriptionSentence:
      type: object
      properties:
        text:
          type: string
          description: Sentence text.
          example: "Welcome back to another episode."
        startMs:
          type: integer
          description: Sentence start, in milliseconds.
          example: 0
        endMs:
          type: integer
          description: Sentence end, in milliseconds.
          example: 1840

    TranscriptionResult:
      type: object
      description: The `result` field of a completed transcription generation.
      properties:
        full_text:
          type: string
          description: The entire transcript as one string.
          example: "Welcome back to another episode. Today we are hunting tacos."
        sentences:
          type: array
          description: Sentence segments in order.
          items:
            $ref: '#/components/schemas/TranscriptionSentence'
        audio_duration:
          type: number
          description: Length of the transcribed audio, in seconds.
          example: 3.62

    X402PaymentMethod:
      type: object
      required: [network, x402Network, asset, payTo, amountUsd, credits]
      properties:
        network:
          type: string
          enum: [sui, solana, base]
          description: Human-readable payment rail to show to users and agents.
        x402Network:
          type: string
          description: x402 network identifier used inside `payment_required.accepts`.
          examples: ["sui", "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp", "eip155:8453"]
        asset:
          type: string
          example: USDC
        payTo:
          type: string
          description: Treasury payment recipient for this rail.
        amountUsd:
          type: string
          description: USD amount represented by this payment method.
        credits:
          type: string
          description: Credits that will be issued after settlement.

    X402Accept:
      type: object
      required: [scheme, network, asset, maxAmountRequired, payTo, resource]
      properties:
        scheme:
          type: string
          example: exact
        network:
          type: string
        asset:
          type: string
          example: USDC
        maxAmountRequired:
          type: string
          description: Atomic USDC amount required by this accept entry.
        payTo:
          type: string
        resource:
          type: string
          example: https://api.gen.pro/v1/x402_credit_purchase
        description:
          type: string
        mimeType:
          type: string
          example: application/json
        extra:
          type: object
          properties:
            checkoutSessionId: { type: integer }
            workspaceId: { type: integer }
            pricingMode: { type: string, enum: [custom_amount, credit_plan] }
            amountUsd: { type: string }
            credits: { type: string }
            network: { type: string, enum: [sui, solana, base] }
            referenceCreditPlanId: { type: integer, nullable: true }

    X402PaymentRequired:
      type: object
      required: [x402Version, accepts]
      properties:
        x402Version:
          type: integer
          example: 2
        error:
          type: string
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/X402PaymentMethod'
        accepts:
          type: array
          items:
            $ref: '#/components/schemas/X402Accept'

    X402CreditPurchaseQuote:
      type: object
      required: [checkout_session_id, workspace_id, amount_usd, credits, payment_methods, payment_required]
      properties:
        checkout_session_id:
          type: integer
        workspace_id:
          type: integer
        pricing_mode:
          type: string
          enum: [custom_amount, credit_plan]
        reference_credit_plan_id:
          type: integer
          nullable: true
        credit_plan_id:
          type: integer
          nullable: true
        quantity:
          type: integer
        amount_usd:
          type: string
        credits:
          type: string
        payment_methods:
          type: array
          description: User/agent-facing Sui, Solana, and Base payment options.
          items:
            $ref: '#/components/schemas/X402PaymentMethod'
        payment_required:
          $ref: '#/components/schemas/X402PaymentRequired'

