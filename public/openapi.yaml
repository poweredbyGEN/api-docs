              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  conversation_id:
                    type: string
                  status:
                    type: string
                    enum: [running, completed, failed, awaiting_approval]
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                          enum: [user, assistant, system]
                        content:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

  /agent/runs/{run_id}/approve:
    post:
      operationId: approveAgentAction
      x-phase: ideas
      summary: Approve or reject a pending agent action
      description: |
        When a run has status `awaiting_approval`, approve the proposed action to continue.
        Send `approved: false` to reject the action and fail the run.

        **Base URL:** `https://agent.gen.pro/v1`
      tags: [Agent Chat]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
                  description: "`true` approves and continues the run; `false` rejects the pending action."
      responses:
        '200':
          description: Action decision accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                    enum: [running, failed]
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
