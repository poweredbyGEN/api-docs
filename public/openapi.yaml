          $ref: '#/components/responses/AgentUnauthorized'
        '422':
          $ref: '#/components/responses/AgentValidationError'

    patch:
      operationId: patchAgentsByAgentIdRecurringJobs
      servers:
        - url: https://agent.gen.pro/v1
      x-phase: ideas
      summary: "Manage recurring jobs and monitoring tasks — update recurring job"
      tags: [Agent Chat]
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  anyOf:
                    - type: "string"
                      maxLength: 200
                      minLength: 1
                    - type: "null"
                job_type:
                  anyOf:
                    - type: "string"
                      maxLength: 100
                      minLength: 1
                    - type: "null"
                prompt:
                  anyOf:
                    - type: "string"
                      maxLength: 20000
                      minLength: 1
                    - type: "null"
                vidsheet_url:
                  anyOf:
                    - type: "string"
                      maxLength: 2000
                      minLength: 1
                    - type: "null"
                schedule:
                  anyOf:
                    - properties:
                        cadence:
                          type: "string"
                          enum:
                            - "minutely"
                            - "hourly"
                            - "daily"
                            - "weekly"
                            - "monthly"
                        timezone:
                          type: "string"
                        time_of_day:
                          anyOf:
                            - type: "string"
                              pattern: "^\\d{2}:\\d{2}$"
                            - type: "null"
                        days_of_week:
                          anyOf:
                            - items:
                                type: "integer"
                              type: "array"
                            - type: "null"
                        day_of_month:
                          anyOf:
                            - type: "integer"
                            - type: "null"
                        interval_value:
                          anyOf:
                            - type: "integer"
                            - type: "null"
                        freshness_window_minutes:
                          anyOf:
                            - type: "integer"
                              maximum: 1440.0
                              minimum: 1.0
                            - type: "null"
                      type: "object"
                      required:
                        - "cadence"
                        - "timezone"
                    - type: "null"
                delivery:
                  anyOf:
                    - properties:
                        type:
                          type: "string"
                          enum:
                            - "chat_only"
                            - "email"
                          default: "email"
                        email:
                          anyOf:
                            - type: "string"
                            - type: "null"
                        recipients:
                          anyOf:
                            - items:
                                type: "string"
                              type: "array"
                            - type: "null"
                        preferences:
                          anyOf:
                            - $ref: "#/components/schemas/RecurringJobDeliveryPreferences"
                            - type: "null"
                      type: "object"
                    - type: "null"
                status:
                  anyOf:
                    - type: "string"
                      enum:
                        - "active"
                        - "paused"
                    - type: "null"
                auto_publish:
                  anyOf:
                    - type: "boolean"
                    - type: "null"
                actions:
                  anyOf:
                    - items:
                        properties:
                          position:
                            type: "integer"
                            minimum: 1.0
                          kind:
                            type: "string"
                            enum:
                              - "update_element"
                              - "update_track"
                            default: "update_element"
                          target:
                            $ref: "#/components/schemas/AutomationActionTarget"
                          update_with:
                            type: "string"
                            maxLength: 4000
                            default: ""
                          model:
                            anyOf:
                              - type: "string"
                                maxLength: 100
                                minLength: 1
                              - type: "null"
                        additionalProperties: false
                        type: "object"
                        required:
                          - "position"
                          - "target"
                      type: "array"
                    - type: "null"
                actions_parallel:
                  anyOf:
                    - type: "boolean"
                    - type: "null"
                auto_generate_video:
                  anyOf:
                    - type: "boolean"
                    - type: "null"
                next_run_at:
                  anyOf:
                    - type: "string"
                      format: "date-time"
                    - type: "null"
                row_strategy:
                  anyOf:
                    - type: "string"
                      enum:
                        - "duplicate_last_row"
                        - "add_new_row"
                    - type: "null"
              type: "object"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/AgentValidationError'
      x-mcp-tool: gen_task_action
      x-mcp-branch: "update_recurring_job"
