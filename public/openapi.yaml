            schema:
              type: "object"
              description: "JSON request body. An image becomes the avatar's original look. A video of a person becomes an uploaded talking loop, its first frame becomes the first look (the cover), and, unless clone_voice is false, its audio is cloned into a new voice that becomes the avatar's primary voice. Cloning a voice uses credits and needs a paid plan; uploading and extracting the frame do not. Send an Idempotency-Key header to retry safely. Refusals: 422 video_has_no_audio, video_too_short_for_voice_clone (the clone needs at least 30 seconds of speech) and video_audio_unreadable (each with param content_resource_id) when clone_voice is true; without clone_voice those videos are created without a voice and voice_clone_message says why."
