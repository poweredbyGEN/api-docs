      description: |
        The post with `platforms_status`: one entry per platform with `normalized_status` (`accepted` → `publishing` → `published` | `failed`), `platform_post_id`, the live `post_url` when published, and `error` / `error_code` / `failed_step` when failed.
      tags: [Publishing]
      responses:
