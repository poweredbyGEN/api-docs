  # ── Generations ────────────────────────────────────────────
  /vidsheet/{sheet_id}/cells/{cell_id}/generate:
    post:
      operationId: generateCellContent
      x-mcp-tool: gen_vidsheet_action
      x-mcp-branch: "generate (cell)"
      x-phase: edit
      summary: Generate content for a cell
      description: |
        Triggers AI content generation for a cell. Credits are pre-charged.
        Poll the generation status via `GET /v1/generations/{id}`.
      tags: [Generations]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CellId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation_type, data]
              properties:
                generation_type:
                  type: string
                  description: |
                    The type of AI generation to run. Canonical names:
                    text, image_from_text, video_from_text, video_from_image,
                    video_from_ingredients, speech_from_text, lipsync, captions,
                    transcription, song.
                    Use canonical names for new integrations. Uploaded media is a
                    cell value (PATCH the cell), not a generation.
                  enum:
                    - text
                    - image_from_text
                    - video_from_text
                    - video_from_image
                    - video_from_ingredients
                    - speech_from_text
                    - lipsync
                    - captions
                    - transcription
                    - song
                  example: "text"
                data:
                  type: object
                  description: |
                    Generation parameters (varies by type). Video generation card data may include
                    `aspect_ratio`, `duration`, optional `resolution` (`1080p` or `720p` where
                    supported), and optional `native_audio` for models that support native audio.
                    Omitted optional fields use the cell defaults or the closest supported model defaults.

                    Video generation accepts the Veo, Kling, Seedance and Grok models plus
                    `gemini-omni-flash-preview` (Gemini Omni Flash, 1-10s). Image generation with
                    `model: "gemini"` takes `version`: `nano-banana`, `nano-banana-pro`,
                    `nano-banana-2` or `nano-banana-2-lite`. The full per-card model lists are on
                    the card reference pages.

                    Song data (`generation_type: "song"`) takes `prompt`, `model` (`suno-v5-beta`,
                    `suno-v4.5plus-beta` or `suno-v5.5-beta`), `duration`, `instrumental`, `style`,
                    `title`, `negative_tags` and `vocal_gender`, plus optional source audio:
                    `source_audio_resource_id` (an existing audio content resource) or a public
                    HTTPS URL as `source_audio_url` (imported as a content resource first), and
                    `audio_weight` (0.0-1.0) for fidelity to the source. Source audio is capped at
                    8 minutes (480 s); longer input is refused before any charge.
                  example:
                    prompt: "A handheld product demo video"
                    model: "veo-3.1"
                    aspect_ratio: "9:16"
                    resolution: "1080p"
                    duration: 8
                    native_audio: false
      responses:
        '201':
          description: Generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  generation_id:
                    type: string
                  status:
                    type: string
                    example: "pending"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Insufficient credits or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vidsheet/{sheet_id}/cells/{cell_id}/layers/{layer_id}/generate:
