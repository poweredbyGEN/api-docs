                - "agent_id"
                - "content_resource_id"
              properties:
                agent_id:
                  type: "string"
                  description: "Agent context; the controller reads params[:agent_id] (`require_agent!`)."
                name:
                  type: "string"
                  description: "Avatar name. Optional: defaults to the file name, else \"New avatar\"."
                content_resource_id:
                  description: "An uploaded image (becomes the original look) or video of a person (becomes a talking loop, its first frame the first look, and its audio a cloned voice unless clone_voice is false)."
                clone_voice:
                  type: "boolean"
                  description: "Videos only (ignored for images). Default true: clone the person's voice from the video's audio into the avatar's primary voice; this uses credits. false skips it. true refuses a video without audio or shorter than 30 seconds instead of creating it without a voice."
                voice_gender:
                  type: "string"
                  enum:
                    - "male"
                    - "female"
                  description: "The cloned voice's gender label. Default female."
                voice_language:
                  type: "string"
                  description: "The cloned voice's language. Default english."
