              required: [text]
      responses:
        '202':
          description: Job enqueued
          content:
            application/json:
              schema:
                type: object
                properties: { user_job_id: { type: integer } }

  /agents/{agent_id}/voice/preview/{job_id}:
    get:
      operationId: getVoicePreviewStatus
      x-phase: setup
      summary: Poll a TTS preview job
      tags: [Agent Voice]
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: User job record

  # ── Watchlists (agent-core.gen.pro) ───────────────────────────────────────
  /agents/{agent_id}/watchlists:
    get:
      operationId: listWatchlists
      x-phase: monitoring
      summary: List active watchlists for an agent
      tags: [Watchlists]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Active watchlists, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Watchlist' }
    post:
      operationId: createWatchlist
      x-phase: monitoring
      summary: Create a watchlist (idempotent on name)
      description: |
        Create a new watchlist with optional initial sources. Idempotent on
        `name` (case-insensitive): if a watchlist with the same name already
        exists for this agent, the provided sources are merged into the
        existing watchlist instead of creating a duplicate.
      tags: [Watchlists]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchlistCreateRequest' }
      responses:
        '201':
          description: Watchlist created or merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Watchlist' }

  /agents/{agent_id}/watchlists/{watchlist_id}:
    get:
      operationId: getWatchlist
      x-phase: monitoring
      summary: Get a single watchlist with sources
      tags: [Watchlists]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: watchlist_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Watchlist record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Watchlist' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateWatchlist
      x-phase: monitoring
      summary: Update a watchlist (also used for pause/resume)
      description: |
        Update mutable fields. Set `intent_active=false` to pause monitoring
        without deleting the watchlist; `true` to resume. Only fields you
        send are updated.
      tags: [Watchlists]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: watchlist_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchlistUpdateRequest' }
      responses:
        '200':
          description: Updated watchlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Watchlist' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteWatchlist
      x-phase: monitoring
      summary: Soft-delete a watchlist
      description: |
        Marks the watchlist and all its sources inactive and deleted. The
        rows are retained in the database. Use PATCH with `intent_active=false`
        for a reversible pause.
      tags: [Watchlists]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: watchlist_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Watchlist deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted: { type: boolean }

  /agents/{agent_id}/watchlists/{watchlist_id}/sources:
    post:
      operationId: addWatchlistSource
      x-phase: monitoring
      summary: Add or restore a source on a watchlist
      description: |
        Idempotent on (platform, target_type, target_value). Re-adding the
        same source returns the existing row (restored if it had been
        soft-deleted).
      tags: [Watchlists]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: watchlist_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchSourceInput' }
      responses:
        '201':
          description: Source added or restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchSource' }
    delete:
      operationId: removeWatchlistSourceByKey
      x-phase: monitoring
      summary: Remove a source by (platform, target_type, target_value)
      tags: [Watchlists]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: watchlist_id, in: path, required: true, schema: { type: string } }
        - { name: platform, in: query, required: true, schema: { type: string } }
        - { name: target_type, in: query, required: true, schema: { type: string, enum: [account, hashtag, keyword] } }
        - { name: target_value, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Source removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  removed: { type: boolean }

  /agents/{agent_id}/watchlists/{watchlist_id}/sources/{source_id}:
    delete:
      operationId: removeWatchlistSource
      x-phase: monitoring
      summary: Remove a source by id
      tags: [Watchlists]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: watchlist_id, in: path, required: true, schema: { type: string } }
        - { name: source_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Source removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  removed: { type: boolean }

  # ── Recurring Jobs / Daily Tasks (agent.gen.pro) ──────────────────────────
  /agents/{agent_id}/recurring-jobs:
    get:
      operationId: listRecurringJobs
      x-phase: monitoring
      summary: List recurring jobs (daily tasks) for an agent
      tags: [Recurring Jobs]
      servers:
        - url: https://agent.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Recurring jobs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  recurring_jobs:
                    type: array
                    items: { $ref: '#/components/schemas/RecurringJob' }
    post:
      operationId: createRecurringJob
      x-phase: monitoring
      summary: Create a recurring agent job
      tags: [Recurring Jobs]
      servers:
        - url: https://agent.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringJobCreate' }
      responses:
        '201':
          description: Created recurring job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringJob' }

  /agents/{agent_id}/recurring-jobs/defaults:
    post:
      operationId: ensureDefaultRecurringJob
      x-phase: monitoring
      summary: Idempotently ensure the default daily content-ideas job
      description: |
        Returns the agent's existing default content-ideas recurring job if
        one exists, otherwise creates it with the standard prompt, daily
        cadence at 09:00 UTC, and `chat_only` delivery. The response `created`
        boolean indicates whether a new job was created.
      tags: [Recurring Jobs]
      servers:
        - url: https://agent.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Default job ensured
          content:
            application/json:
              schema:
                type: object
                properties:
                  recurring_jobs:
                    type: array
                    items: { $ref: '#/components/schemas/RecurringJob' }
                  created: { type: boolean }

  /agents/{agent_id}/recurring-jobs/{job_id}:
    get:
      operationId: getRecurringJob
      x-phase: monitoring
      summary: Get one recurring job
      tags: [Recurring Jobs]
      servers:
        - url: https://agent.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Recurring job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringJob' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateRecurringJob
      x-phase: monitoring
      summary: Update a recurring job's mutable fields
      tags: [Recurring Jobs]
      servers:
        - url: https://agent.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: job_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringJobUpdate' }
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringJob' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRecurringJob
      x-phase: monitoring
      summary: Soft-delete a recurring job
      tags: [Recurring Jobs]
      servers:
        - url: https://agent.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Deleted (no content)
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agent_id}/recurring-jobs/{job_id}/pause:
    post:
      operationId: pauseRecurringJob
      x-phase: monitoring
      summary: Pause a recurring job
      tags: [Recurring Jobs]
      servers:
        - url: https://agent.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Paused job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringJob' }

  /agents/{agent_id}/recurring-jobs/{job_id}/resume:
    post:
      operationId: resumeRecurringJob
      x-phase: monitoring
      summary: Resume a paused recurring job
      tags: [Recurring Jobs]
      servers:
        - url: https://agent.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Resumed job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringJob' }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Personal Access Token (PAT). Create one in Settings > API Keys.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT issued by the GEN dashboard sign-in.

  parameters:
    AgentId:
      name: agent_id
      in: query
      required: true
      description: The agent ID. Find via `GET /v1/agents`.
      schema:
        type: string
    AgentIdPath:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
    SheetId:
      name: sheet_id
      in: path
      required: true
      schema:
        type: string
    RowId:
      name: row_id
      in: path
      required: true
      schema:
        type: string
    CellId:
      name: cell_id
      in: path
      required: true
      schema:
        type: string
    LayerId:
      name: layer_id
      in: path
      required: true
      schema:
        type: string
    TokenId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    X402PaymentMethod:
      type: object
      required: [network, x402Network, asset, payTo, amountUsd, credits]
      properties:
        network:
          type: string
          enum: [sui, solana, base]
          description: Human-readable payment rail to show to users and agents.
        x402Network:
          type: string
          description: x402 network identifier used inside `payment_required.accepts`.
          examples: ["sui", "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp", "eip155:8453"]
        asset:
          type: string
          example: USDC
        payTo:
          type: string
          description: Treasury payment recipient for this rail.
        amountUsd:
          type: string
          description: USD amount represented by this payment method.
        credits:
          type: string
          description: Credits that will be issued after settlement.

    X402Accept:
      type: object
      required: [scheme, network, asset, maxAmountRequired, payTo, resource]
      properties:
        scheme:
          type: string
          example: exact
        network:
          type: string
        asset:
          type: string
          example: USDC
        maxAmountRequired:
          type: string
          description: Atomic USDC amount required by this accept entry.
        payTo:
          type: string
        resource:
          type: string
          example: https://api.gen.pro/v1/x402_credit_purchase
        description:
          type: string
        mimeType:
          type: string
          example: application/json
        extra:
          type: object
          properties:
            checkoutSessionId: { type: integer }
            workspaceId: { type: integer }
            pricingMode: { type: string, enum: [custom_amount, credit_plan] }
            amountUsd: { type: string }
            credits: { type: string }
            network: { type: string, enum: [sui, solana, base] }
            referenceCreditPlanId: { type: integer, nullable: true }

    X402PaymentRequired:
      type: object
      required: [x402Version, accepts]
      properties:
        x402Version:
          type: integer
          example: 2
        error:
          type: string
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/X402PaymentMethod'
        accepts:
          type: array
          items:
            $ref: '#/components/schemas/X402Accept'

    X402CreditPurchaseQuote:
      type: object
      required: [checkout_session_id, workspace_id, amount_usd, credits, payment_methods, payment_required]
      properties:
        checkout_session_id:
          type: integer
        workspace_id:
          type: integer
        pricing_mode:
          type: string
          enum: [custom_amount, credit_plan]
        reference_credit_plan_id:
          type: integer
          nullable: true
        credit_plan_id:
          type: integer
          nullable: true
        quantity:
          type: integer
        amount_usd:
          type: string
        credits:
          type: string
        payment_methods:
          type: array
          description: User/agent-facing Sui, Solana, and Base payment options.
          items:
            $ref: '#/components/schemas/X402PaymentMethod'
        payment_required:
          $ref: '#/components/schemas/X402PaymentRequired'

    SongMixTrack:
      type: object
      properties:
        title:
          type: string
          nullable: true
        artist:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
        asset_id:
          type: string
          nullable: true
        bpm:
          type: number
          minimum: 40
          maximum: 240
          nullable: true
        key:
          type: string
          nullable: true
        mood:
          type: string
          nullable: true

    SongMixRequest:
      type: object
      properties:
        tracks:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/SongMixTrack'
        prompt:
          type: string
          nullable: true
        transition_style:
          type: string
          nullable: true
          default: professional
        output_format:
          type: string
          enum: [mp3, wav]
          default: mp3
        auto_order:
          type: boolean
          default: true
        desired_duration_seconds:
          type: integer
          minimum: 30
          maximum: 7200
          nullable: true
        generate_missing_count:
          type: integer
          minimum: 1
          maximum: 25
          nullable: true

    SongMixJob:
      type: object
      required: [job_id, status, prompt, tracks, engine, output_format, transition_style, auto_order, message, next_step]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending_engine, pending_song_generation]
        prompt:
          type: string
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/SongMixTrack'
        engine:
          type: string
          example: mixxx_or_compatible
        output_format:
          type: string
          example: mp3
        transition_style:
          type: string
          example: professional
        auto_order:
          type: boolean
          example: true
        desired_duration_seconds:
          type: integer
          nullable: true
          minimum: 30
          maximum: 7200
        output_url:
          type: string
          nullable: true
        message:
          type: string
        next_step:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        username:
          type: string
        created_at:
          type: string

    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        token_type:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, expired, revoked]

    Sheet:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        project_type:
          type: string
        is_default:
          type: boolean
        uuid:
          type: string
        status:
          type: string
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        created_at_ts:
          type: integer
          description: Unix timestamp (milliseconds)
        updated_at_ts:
          type: integer
          description: Unix timestamp (milliseconds)
        spreadsheet_columns:
          type: array
          items:
            $ref: '#/components/schemas/Column'
        spreadsheet_rows:
          type: array
          items:
            $ref: '#/components/schemas/Row'
        global_variables_sheet:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Sheet'

    Row:
      type: object
      properties:
        id:
          type: string
        position:
          type: integer
        additional_attributes:
          type: object
        created_at_ts:
          type: integer
        updated_at_ts:
          type: integer
        spreadsheet_cells:
          type: array
          items:
            $ref: '#/components/schemas/Cell'
        execution_cost:
          type: string
          nullable: true
          description: Total credit cost (only when `with_execution_cost=true`).

    Column:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        temp_title:
          type: string
          nullable: true
        type:
          type: string
        column_role:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        position:
          type: integer
        additional_attributes:
          type: object
        created_at_ts:
          type: integer
        updated_at_ts:
          type: integer

    Cell:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
          nullable: true
        additional_attributes:
          type: object
        cell_role:
          type: string
          nullable: true
        created_at_ts:
          type: integer
        updated_at_ts:
          type: integer
        default_user_job:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Generation'
        user_jobs:
          type: array
          items:
            $ref: '#/components/schemas/Generation'
        video_layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
        execution_cost:
          type: string
          nullable: true

    Layer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: integer
        type:
          type: string
        additional_attributes:
          type: object
        created_at_ts:
          type: integer
        updated_at_ts:
          type: integer
        default_user_job:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Generation'
        user_jobs:
          type: array
          items:
            $ref: '#/components/schemas/Generation'
        execution_cost:
          type: string
          nullable: true

    Generation:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed, stopped]
        user_job_type:
          type: string
        result:
          type: object
          nullable: true
        failed_reason:
          type: string
          nullable: true
        output_resources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              url:
                type: string
                format: uri
              thumbnail_url:
                type: string
                format: uri
                nullable: true
              object_type:
                type: string
                description: '"Video", "Image", etc.'
              type:
                type: string
        execution_cost:
          type: string
          nullable: true

    AutomationConfig:
      type: object
      properties:
        webhook_url:
          type: string
          format: uri
          nullable: true
        callback_url:
          type: string
          format: uri
          nullable: true
        polling_enabled:
          type: boolean

    Template:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        name:
          type: string
        description:
          type: string
        cover:
          type: string
          format: uri
          nullable: true
        tutorial_url:
          type: string
          format: uri
          nullable: true
        tags:
          type: array
          items:
            type: string
        recent_generated_contents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              thumbnail_url:
                type: string
                format: uri

    AgentDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        organization_id:
          type: string
        time_zone:
          type: string
          nullable: true
        primary_avatar_id:
          type: string
          nullable: true
        primary_avatar_url:
          type: string
          format: uri
          nullable: true
        agent_setup_project_id:
          type: string
          nullable: true
        role:
          type: string
        default_user_voice:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            gender:
              type: string
            language:
              type: string
            provider:
              type: string
            url:
              type: string
              format: uri

    Avatar:
      type: object
      properties:
        id:
          type: string
        is_primary:
          type: boolean
        url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
          nullable: true
        degod_avatar_id:
          type: string
          nullable: true

    Organization:
      type: object
      properties:
        id:
          type: string
        uuid:
          type: string
        organization_id:
          type: string
        name:
          type: string
        avatar:
          type: object
          nullable: true
          properties:
            url:
              type: string
              format: uri
            thumbnail_url:
              type: string
              format: uri
        user_role:
          type: string
        credit:
          type: number
        available_credit:
          type: object
          properties:
            generic:
              type: number
            aura:
              type: number
        total_members:
          type: integer
        credit_plan:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            cycle:
              type: string

    ContentResource:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
          nullable: true
        file_name:
          type: string
        content_type:
          type: string

    DirectUpload:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        filename:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
        checksum:
          type: string
        signed_id:
          type: string
          description: Use this as `content_resource[file]` when creating a content resource.
        direct_upload:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: Pre-signed S3 URL. PUT the file here.
            headers:
              type: object
              properties:
                Content-Type:
                  type: string
                Content-MD5:
                  type: string

    AgentProfile:
      type: object
      properties:
        identity:
          type: object
          description: Agent identity configuration (name, persona, backstory).
        voice:
          type: object
          description: Voice and tone settings.
        brand:
          type: object
          description: Brand guidelines, colors, and style.

    AgentProfileInput:
      type: object
      description: All fields are optional. Provide only the sections you want to set.
      properties:
        identity:
          type: object
        voice:
          type: object
        brand:
          type: object

    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
        agent_id:
          type: string
        pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant, system]
              content:
                type: string
              created_at:
                type: string
                format: date-time

    Idea:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [generated, approve_to_create, ready_for_review, change_idea, change_video, rejected, approved_to_post, posted]
        agent_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
        error_code:
          type: string
          description: Machine-readable error code.

    # ── Agent Core schemas ──────────────────────────────────
    # Flat schema — every field name mirrors the public Agent Core setup fields.
    AgentCore:
      type: object
      description: Full agent setup as returned by GET /agents/{id}/core.
      properties:
        agent_id: { type: string }
        brand_name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        identity_type: { type: string, enum: [brand, character], nullable: true }
        goal: { type: string, nullable: true, description: "Comma-separated, e.g. 'growth,authority,sales'" }
        target_platforms:
          type: array
          items: { type: string }
        shortform: { type: boolean, nullable: true }
        longform: { type: boolean, nullable: true }
        onboarding_status: { type: string, nullable: true }
        keywords:
          type: array
          items: { type: string }
          description: Flat keyword list used by the monitoring cron. Auto-mirrored into `monitored` on write.
        monitored:
          type: array
          items: { $ref: '#/components/schemas/MonitoredItem' }
          description: Inspiration sources — accounts, hashtags, or keywords the agent monitors for trending content.
        linked_accounts:
          type: array
          items: { $ref: '#/components/schemas/LinkedAccount' }
          description: The agent's OWN brand social links. NOT the same as `monitored` (which holds sources to watch).
        personality:
          type: string
          nullable: true
          description: Full persona text for the agent.
        default_user_voice:
          $ref: '#/components/schemas/VoiceRef'
        proof_of_genesis_enabled:
          type: boolean
          description: Master switch for automatic Backup to Blockchain from asset/vidsheet events.
        proof_of_genesis_auto_backup_sources:
          type: array
          description: Asset events that should trigger automatic Proof of Genesis backups.
          items:
            type: string
            enum: [generated, uploaded, downloaded, published]
        proof_of_genesis_auto_backup_asset_types:
          type: array
          description: Asset types eligible for automatic Proof of Genesis backup.
          items:
            type: string
            enum: [video, image]

    AgentCorePatch:
      type: object
      additionalProperties: false
      description: |
        Flat merge-patch body. Send any subset of fields — missing fields are not forwarded.
        Unknown fields return 422. `linked_accounts` and `monitored` use full-list replacement
        semantics: rows not in the list are deleted. To add without touching others, GET first,
        append, then PATCH.
      properties:
        brand_name: { type: string, maxLength: 200 }
        description:
          type: string
          maxLength: 500
          description: Short 2-3 sentence brand summary. NOT full persona — that goes in `personality`.
        identity_type: { type: string, enum: [brand, character] }
        goal: { type: string, maxLength: 100 }
        target_platforms:
          type: array
          items: { type: string }
          maxItems: 10
        shortform: { type: boolean }
        longform: { type: boolean }
        onboarding_status: { type: string, maxLength: 50 }
        keywords:
          type: array
          items: { type: string }
          maxItems: 20
          description: Flat keyword list. If set without `monitored`, auto-mirrored into monitored with item_type='keyword'.
        monitored:
          type: array
          items: { $ref: '#/components/schemas/MonitoredItem' }
          maxItems: 50
          description: Full inspiration source list (replaces the existing list).
        linked_accounts:
          type: array
          items: { $ref: '#/components/schemas/LinkedAccount' }
          maxItems: 20
        personality:
          type: string
          maxLength: 20000
          description: Full persona text for the agent.
        default_user_voice:
          $ref: '#/components/schemas/VoiceRef'
        proof_of_genesis_enabled:
          type: boolean
          description: Master switch for automatic Backup to Blockchain from asset/vidsheet events.
        proof_of_genesis_auto_backup_sources:
          type: array
          description: Replace the list of asset events that should trigger automatic Proof of Genesis backups. Empty means no automatic backup.
          items:
            type: string
            enum: [generated, uploaded, downloaded, published]
        proof_of_genesis_auto_backup_asset_types:
          type: array
          description: Replace the list of asset types eligible for automatic Proof of Genesis backup.
          items:
            type: string
            enum: [video, image]

    ProofOfGenesisBackupCreate:
      type: object
      description: Manual or event-triggered request to back up a GEN asset to Walrus.
      properties:
        asset_url:
          type: string
          description: GEN asset URL to back up. Preferred field.
        video_url:
          type: string
          description: Legacy alias for asset_url.
        asset_type:
          type: string
          enum: [video, image]
          default: video
        visibility:
          type: string
          enum: [private, public]
          default: private
          description: Private assets must be encrypted before upload. Raw private requests are rejected before billing or Walrus work.
        encrypted:
          type: boolean
          default: false
          description: Whether the asset bytes are already encrypted before Walrus upload. Required with encryption_scheme for private assets.
        encryption_scheme:
          type: string
          nullable: true
          maxLength: 128
          description: Required when visibility is private, e.g. seal/v1.
        encryption_key_id:
          type: string
          nullable: true
          maxLength: 256
          description: Optional key policy/version identifier for private proof metadata.
        owner_sui_address:
          type: string
          nullable: true
          description: Optional customer Sui wallet address that should own the Walrus object. Server-triggered auto-backup can resolve this from the user's Dynamic Sui wallet.
        source_event:
          type: string
          enum: [manual, generated, uploaded, downloaded, published]
          default: manual
        content_type:
          type: string
          nullable: true
        idempotency_key:
          type: string
          description: Stable retry key, e.g. content-resource id plus version.
        metadata:
          type: object
          additionalProperties: true
      anyOf:
        - required: [asset_url]
        - required: [video_url]

    ProofOfGenesisBackup:
      type: object
      properties:
        id: { type: integer }
        agent_id: { type: string }
        status: { type: string, enum: [uploading, synced, failed, billing_failed] }
        source_event: { type: string, enum: [manual, generated, uploaded, downloaded, published] }
        source_url: { type: string }
        asset_type: { type: string, enum: [video, image] }
        visibility: { type: string, enum: [private, public] }
        encrypted: { type: boolean }
        encryption_scheme: { type: string, nullable: true }
        encryption_key_id: { type: string, nullable: true }
        owner_sui_address: { type: string, nullable: true }
        custody_mode:
          type: string
          nullable: true
          enum: [gen_custody, customer_wallet, null]
          description: Whether GEN or the customer's Sui wallet owns the Walrus object.
        walrus_object_recipient_address:
          type: string
          nullable: true
          description: Sui address passed to Walrus send_object_to for customer-owned object transfer.
        content_sha256: { type: string, nullable: true }
        size_bytes: { type: integer, nullable: true }
        content_type: { type: string, nullable: true }
        walrus_blob_id: { type: string, nullable: true }
        walrus_blob_object_id: { type: string, nullable: true }
        walrus_storage_id: { type: string, nullable: true }
        walrus_start_epoch: { type: integer, nullable: true }
        walrus_end_epoch: { type: integer, nullable: true }
        walrus_encoded_length_bytes: { type: integer, nullable: true }
        walrus_cost_wal: { type: integer, nullable: true }
        verification_status: { type: string, nullable: true, enum: [verified, skipped, null] }
        billing_operation: { type: string, example: backup_to_blockchain }
        billing_charge_id: { type: integer, nullable: true }
        billing_amount_charged: { type: string, nullable: true }
        billing_new_balance: { type: string, nullable: true }
        billing_outboxed: { type: boolean }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Approximate Walrus expiry for the current monthly storage period.
        renewal_due_at:
          type: string
          format: date-time
          nullable: true
          description: When Agent Core should attempt monthly renewal, currently three days before expires_at.
        renewal_status:
          type: string
          description: Monthly renewal state for this backup.
          enum: [not_due, due, renewing, renewed, renewal_blocked, renewal_failed]
        renewal_attempts:
          type: integer
          description: Number of renewal attempts recorded by Agent Core.
        last_renewed_at:
          type: string
          format: date-time
          nullable: true
        failure_code: { type: string, nullable: true }
        failure_message: { type: string, nullable: true }
        removed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    ProofOfGenesisBackupList:
      type: object
      required: [backups]
      properties:
        backups:
          type: array
          items:
            $ref: '#/components/schemas/ProofOfGenesisBackup'

    MonitoredItem:
      type: object
      additionalProperties: false
      required: [handle, item_type]
      properties:
        handle:
          type: string
          minLength: 1
          maxLength: 300
          description: For accounts — a @handle or URL. For hashtags — the tag (with or without #). For keywords — the search term.
        item_type:
          type: string
          enum: [account, hashtag, keyword]

    LinkedAccount:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        id:
          type: integer
          description: Row id if updating an existing row. Omit when adding a new account.
        url: { type: string, minLength: 1, maxLength: 500 }
        platform:
          type: string
          maxLength: 50
          description: 'tiktok | instagram | youtube | x | linkedin | pinterest | facebook | threads | website | other'
        display_name: { type: string, maxLength: 200 }

    VoiceRef:
      type: object
      additionalProperties: false
      required: [voice_id]
      properties:
        voice_id: { type: string, minLength: 1, maxLength: 200 }
        source:
          type: string
          enum: [public, user_designed, user_trained, user_elevenlabs]
        name: { type: string, maxLength: 200 }

    AgentCorePatchResult:
      type: object
      description: |
        Per-section result. A PATCH to Agent Core may update multiple sections atomically.
        Section keys currently returned:
          - `brand` — brand fields (brand_name, description, identity_type, goal,
            target_platforms, shortform, longform, onboarding_status, keywords, monitored,
            linked_accounts). Clients should treat section keys as opaque strings.
          - `personality` — personality text.
          - `voice` — voice association.
        Each section appears only if the PATCH touched at least one field it owns.
        `status=ok` means that section succeeded. `status=error` means it failed
        (see `error` field). A 207 Multi-Status means at least one section errored.
      additionalProperties:
        type: object
        properties:
          status: { type: string, enum: [ok, error] }
          data:
            description: Target-specific payload on success.
          error:
            type: string
            description: Error message on failure.

    VoiceLibraryItem:
      type: object
      properties:
        voice_id: { type: string }
        name: { type: string, nullable: true }
        source: { type: string, enum: [public, user_designed, user_trained, user_elevenlabs] }
        preview_url: { type: string, nullable: true }

    # ── Watchlists ──────────────────────────────────────────────────────────
    WatchSourceInput:
      type: object
      required: [platform, target_type, target_value]
      properties:
        platform: { type: string, description: 'e.g. "tiktok", "instagram", "youtube"' }
        target_type: { type: string, enum: [account, hashtag, keyword] }
        target_value: { type: string, description: '@handle, hashtag name (no #), or keyword text' }
        original_display_value:
          type: string
          nullable: true
          description: Optional original display form (e.g. "#glassskin" or "@drunkelephant")

    WatchSource:
      allOf:
        - $ref: '#/components/schemas/WatchSourceInput'
        - type: object
          required: [id, watchlist_id, agent_id, intent_active]
          properties:
            id: { type: string }
            watchlist_id: { type: string }
            agent_id: { type: string }
            intent_active: { type: boolean }
            created_at: { type: string, format: date-time, nullable: true }
            updated_at: { type: string, format: date-time, nullable: true }

    WatchlistCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: 'Display name. Idempotent: same name reuses existing watchlist.' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/WatchSourceInput' }
        project_id:
          oneOf: [{ type: string }, { type: integer }]
          nullable: true
        conversation_id: { type: string, nullable: true }
        created_by_run_id: { type: string, nullable: true }

    WatchlistUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        intent_active: { type: boolean, description: 'Set false to pause monitoring; true to resume.' }
        project_id:
          oneOf: [{ type: string }, { type: integer }]
          nullable: true

    Watchlist:
      type: object
      required: [id, user_id, agent_id, name, intent_active, sources]
      properties:
        id: { type: string }
        user_id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        intent_active: { type: boolean }
        project_id: { type: string, nullable: true }
        project_error: { type: string, nullable: true, description: 'Read-only. Last project-link sync error, if any.' }
        conversation_id: { type: string, nullable: true }
        created_by_run_id: { type: string, nullable: true }
        sources:
          type: array
          items: { $ref: '#/components/schemas/WatchSource' }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    # ── Recurring Jobs (Daily Tasks) ───────────────────────────────────────
    RecurringJobSchedule:
      type: object
      required: [cadence, timezone]
      properties:
        cadence: { type: string, enum: [daily, weekly] }
        timezone: { type: string, description: 'IANA timezone (e.g. "UTC", "America/Los_Angeles")' }
        time_of_day:
          type: string
          description: 'Local clock time "HH:MM" (24h). Required for daily/weekly cadences.'
        days_of_week:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 'Days to run (0=Mon … 6=Sun). REQUIRED when cadence="weekly"; must be omitted when cadence="daily". No duplicates.'

    RecurringJobDelivery:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [chat_only, email] }
        email:
          type: string
          description: 'Recipient email. REQUIRED when type="email"; must be omitted when type="chat_only".'

    RecurringJob:
      type: object
      required: [id, user_id, agent_id, name, job_type, prompt, schedule, delivery, status, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: integer }
        agent_id: { type: string }
        name: { type: string }
        job_type: { type: string, description: 'e.g. "generate_content_ideas"' }
        prompt: { type: string }
        schedule: { $ref: '#/components/schemas/RecurringJobSchedule' }
        delivery: { $ref: '#/components/schemas/RecurringJobDelivery' }
        status: { type: string, enum: [active, paused, deleted] }
        next_run_at: { type: string, format: date-time, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RecurringJobCreate:
      type: object
      required: [job_type, prompt, schedule, delivery]
      properties:
        name: { type: string, description: 'Optional. Defaults to first 80 chars of prompt.' }
        job_type: { type: string }
        prompt: { type: string }
        schedule: { $ref: '#/components/schemas/RecurringJobSchedule' }
        delivery: { $ref: '#/components/schemas/RecurringJobDelivery' }
        next_run_at: { type: string, format: date-time }

    RecurringJobUpdate:
      type: object
      properties:
        name: { type: string }
        prompt: { type: string }
        schedule: { $ref: '#/components/schemas/RecurringJobSchedule' }
        delivery: { $ref: '#/components/schemas/RecurringJobDelivery' }
        next_run_at: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
            error_code: "unauthorized"

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Not found"
            error_code: "not_found"

    CreditRequired:
      description: Active GEN credits required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "GEN credits are required to use the API."
            error_code: "usable_gen_credit_required"
