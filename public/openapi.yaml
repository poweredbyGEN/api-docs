        key:
          type: string
        filename:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
        checksum:
          type: string
        signed_id:
          type: string
          description: Use this as `content_resource[file]` when creating a content resource.
        direct_upload:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: Pre-signed S3 URL. PUT the file here.
            headers:
              type: object
              properties:
                Content-Type:
                  type: string
                Content-MD5:
                  type: string

    AgentProfile:
      type: object
      properties:
        identity:
          type: object
          description: Agent identity configuration (name, persona, backstory).
        voice:
          type: object
          description: Voice and tone settings.
        brand:
          type: object
          description: Brand guidelines, colors, and style.

    AgentProfileInput:
      type: object
      description: All fields are optional. Provide only the sections you want to set.
      properties:
        identity:
          type: object
        voice:
          type: object
        brand:
          type: object

    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
        agent_id:
          type: string
        pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant, system]
              content:
                type: string
              created_at:
                type: string
                format: date-time

    Idea:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [generated, approve_to_create, ready_for_review, change_idea, change_video, rejected, approved_to_post, posted]
        agent_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
        error_code:
          type: string
          description: Machine-readable error code.

    # ── Publishing (schedule) schemas ─────────────────────────
    PublishPlatform:
      type: string
      enum: [tiktok, instagram, facebook, youtube, x, linkedin]

    PublishPlatformRule:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/PublishPlatform'
        label:
          type: string
          example: LinkedIn
        text_only:
          type: boolean
          description: Whether a post with no media is accepted.
        media:
          type: array
          items:
            type: string
            enum: [video, image, document]
        max_media_items:
          type: integer
          example: 9
        max_text:
          type: integer
          description: Caption / description character limit.
          example: 3000
        max_title:
          type: integer
          nullable: true
          description: Title character limit; null when the platform ignores `title`.
          example: 400
        required:
          type: array
          items:
            type: string
        optional:
          type: array
          items:
            type: string
        ignored:
          type: array
          items:
            type: string
        options:
          type: object
          description: The platform's options object (`instagram_music`, `youtube_options` or `linkedin_options`) mapped to its fields and the values each accepts. Empty for platforms without options.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          example:
            linkedin_options:
              visibility: "public (default) | connections | loggedin"
              alt_text: "string[] — alternative text per image, in media order (images only)"
        editable_after_publish:
          type: array
          description: |
            Fields `PATCH /schedule/post/{post_id}/published` can still change once the post is live. Empty means the network has no supported post-publication edit and that endpoint answers `unsupported_after_publish` for it.
          items:
            type: string
          example: [title, description, tags, category_id]
        notes:
          type: string

    PublishedPostUpdate:
      type: object
      description: |
        A sparse metadata edit for a post that has already published. Send only the fields you want changed; every other field on the live post is preserved. At least one field is required.
      minProperties: 1
      properties:
        title:
          type: string
          description: New title. YouTube allows up to 100 characters and rejects a blank title.
        description:
          type: string
          description: |
            New description / caption. YouTube allows up to 5,000 **bytes** (not characters — emoji and CJK cost several bytes each). An explicit `null` clears the description.
        tags:
          type: array
          description: YouTube only — replaces the video's tags. Each tag is 2+ characters and all tags together are at most 400 characters.
          items:
            type: string
        category_id:
          type: integer
          description: YouTube only — video category ID (for example 22 People & Blogs, 24 Entertainment).

    PublishedPostUpdateResult:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/PublishPlatform'
        platform_post_id:
          type: string
          nullable: true
          description: The platform's own ID for the live post (a YouTube video ID).
        result:
          type: string
          enum: [updated, unsupported_after_publish, reauthorization_required, failed]
          description: |
            `updated` — the platform accepted the edit and `metadata` is what it holds now.
            `unsupported_after_publish` — this network has no post-publication edit for this content; nothing was touched.
            `reauthorization_required` — GEN's saved authorization for this account can no longer edit the post; the user must reconnect it (GEN app → Setup → Accounts).
            `failed` — the platform rejected the edit; `message` carries its reason.
        updated_fields:
          type: array
          description: Present on `updated` — the fields that were sent to the platform.
          items:
            type: string
        metadata:
          type: object
          description: Present on `updated` — the metadata read back from the platform after the write, not the values that were sent.
        quota_units:
          type: integer
          description: Present on `updated` — the platform API quota the update consumed (YouTube charges 50 units per update).
          example: 50
        message:
          type: string
          description: Why this platform could not be updated. Absent on `updated`.

    PublishedPostUpdateResponse:
      type: object
      properties:
        post_id:
          type: integer
        results:
          type: array
          description: One entry per platform the post went out on, in the post's platform order.
          items:
            $ref: '#/components/schemas/PublishedPostUpdateResult'

    InstagramMusic:
      type: object
      description: Instagram only. Mixes a music track under every video item before upload (Instagram cannot attach audio to images or carousels via API). Needs at least one video item.
      properties:
        mode:
          type: string
          enum: [auto, none]
          default: auto
          description: '`auto` picks a track from the GEN music library; when none is available the post publishes without music and `music_track` is null.'
        track_url:
          type: string
          format: uri
          description: An https audio file to mix instead of an auto-picked track.

    YouTubeOptions:
      type: object
      description: YouTube only.
      properties:
        visibility:
          type: string
          enum: [public, unlisted, private]
          default: public
        shorts:
          type: boolean
          default: false
          description: Post as a YouTube Short (adds `#shorts` to the description; keep the video vertical and under 3 minutes). The published `post_url` is then `https://www.youtube.com/shorts/{id}`.
        tags:
          type: array
          items:
            type: string
            minLength: 2
          description: 400 characters in total.
        made_for_kids:
          type: boolean
          default: false
        notify_subscribers:
          type: boolean
          default: true
        category_id:
          type: integer
          default: 22
          description: YouTube video category (22 = People & Blogs).

    LinkedInOptions:
      type: object
      description: LinkedIn only.
      properties:
        visibility:
          type: string
          enum: [public, connections, loggedin]
          default: public
        alt_text:
          type: array
          items:
            type: string
          description: One entry per image, in media order. Images only.
        carousel:
          type: boolean
          default: false
          description: Post 2-9 images as a swipeable LinkedIn carousel - a PDF document built from the images, one page each - instead of the multi-image grid (LinkedIn has no image carousel for organic posts). The post `title` becomes the document title.

    SchedulePostContent:
      type: object
      properties:
        media_type:
          type: string
          enum: [VIDEO, IMAGE, REELS, TWEET_VIDEO]
          default: VIDEO
        media_url:
          type: string
          format: uri
          description: Public URL of the first (or only) media file — a video, an image, or for LinkedIn a PDF/PPT/PPTX/DOC/DOCX document. Required for TikTok, Instagram, Facebook and YouTube. The file extension decides image vs video vs document.
        media_urls:
          type: array
          items:
            type: string
            format: uri
          description: Further media URLs for the same post. Instagram — `media_url` plus `media_urls` totalling 2-10 images and videos post as one carousel. X — up to 4 images. LinkedIn — up to 9 images. One item elsewhere.
        description:
          type: string
          description: Caption / post text. Per-platform limit (X 280, TikTok/Instagram 2,200, LinkedIn 3,000, YouTube 5,000, Facebook 63,206). Required for a text-only X or LinkedIn post.
        title:
          type: string
          description: Required for YouTube (max 100). Optional for Facebook (255) and LinkedIn (400). Ignored elsewhere.
        thumbnail_url:
          type: string
          format: uri
          description: Custom thumbnail; generated from the video when omitted. YouTube uploads it as the video's thumbnail (https, .jpg/.jpeg/.png, under 2 MB) — a thumbnail problem is reported as `warning`, the video still publishes.
        instagram_music:
          $ref: '#/components/schemas/InstagramMusic'
        youtube_options:
          $ref: '#/components/schemas/YouTubeOptions'
        linkedin_options:
          $ref: '#/components/schemas/LinkedInOptions'
        thread:
          type: array
          description: X only. Ordered tweet segments, each limited to 280 characters.
          items:
            type: object
            properties:
              text:
                type: string
              media_urls:
                type: array
                items:
                  type: string
                  format: uri
        reply_to_tweet_id:
          type: string
          description: X only. Post as a reply to this tweet id.
        tiktok_privacy_level:
          type: string
          enum: [PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR, SELF_ONLY]
        tiktok_disable_comment:
          type: boolean
        tiktok_disable_duet:
          type: boolean
        tiktok_disable_stitch:
          type: boolean
        tiktok_disclose_commercial_content:
          type: boolean
          default: false
        tiktok_your_brand:
          type: boolean
          default: false
        tiktok_branded_content:
          type: boolean
          default: false

    SchedulePostRequest:
      allOf:
        - $ref: '#/components/schemas/SchedulePostContent'
        - type: object
          required: [agent_id, platform]
          properties:
            agent_id:
              type: string
            platform:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PublishPlatform'
            schedule_type:
              type: string
              enum: [now, specific_time, next_available]
              default: next_available
            scheduled_time:
              type: string
              description: ISO 8601 UTC (e.g. `2026-09-20T15:00:00Z`). Required for `specific_time`; must be in the future.
              example: "2026-09-20T15:00:00Z"
            strict:
              type: boolean
              default: false
              description: When true, a platform that cannot take this content (e.g. Instagram with no media) is a 422 instead of a reported skip. Recommended for API clients.

    SchedulePostUpdate:
      allOf:
        - $ref: '#/components/schemas/SchedulePostContent'
        - type: object
          properties:
            platform:
              type: array
              items:
                $ref: '#/components/schemas/PublishPlatform'
            schedule_type:
              type: string
              enum: [now, specific_time, next_available]
            scheduled_time:
              type: string

    PostPlatformStatus:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/PublishPlatform'
        status:
          type: string
          description: Raw worker status.
        normalized_status:
          type: string
          enum: [accepted, publishing, published, failed]
        platform_post_id:
          type: string
          nullable: true
          description: The platform's id for the live post.
        post_url:
          type: string
          nullable: true
          format: uri
          description: Public link to the live post (YouTube watch URL, Instagram permalink, Facebook Page video, TikTok video, X status, LinkedIn post). Set when published.
        published_at:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        failed_step:
          type: string
          nullable: true
        warning:
          type: string
          nullable: true
          description: 'Non-fatal problem recorded by the worker while the post itself succeeded (e.g. `thumbnail_failed: ...` on YouTube).'
        platform_options:
          type: object
          nullable: true
          description: The `instagram_music` / `youtube_options` / `linkedin_options` objects as sent.
        scheduled_time:
          type: string
        media_url:
          type: string
          nullable: true
        media_urls:
          type: array
          nullable: true
          items:
            type: string
        description:
          type: string
          nullable: true
        title:
          type: string
          nullable: true

    ScheduleCreateResponse:
      type: object
      properties:
        message:
          type: string
        post_id:
          type: integer
          example: 48213
        platforms:
          type: array
          description: The platforms requested.
          items:
            $ref: '#/components/schemas/PublishPlatform'
        platforms_status:
          type: array
          description: One entry per platform that will be published; fills in as the worker completes.
          items:
            $ref: '#/components/schemas/PostPlatformStatus'
        platforms_skipped:
          type: array
          description: Platforms that cannot take this content (only when `strict` is false).
          items:
            type: object
            properties:
              platform:
                $ref: '#/components/schemas/PublishPlatform'
              reason:
                type: string
        status_url:
          type: string
          example: /schedule/post/48213
        idempotent_replay:
          type: boolean
        post:
          $ref: '#/components/schemas/ScheduledPost'

    ScheduledPost:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: string
        status:
          type: string
        schedule_type:
          type: string
          enum: [now, specific_time, next_available]
        scheduled_time:
          type: string
        media_type:
          type: string
        media_url:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
        media_urls:
          type: array
          nullable: true
          items:
            type: string
        platform_options:
          type: object
          nullable: true
        platforms_status:
          type: array
          items:
            $ref: '#/components/schemas/PostPlatformStatus'

    PlatformValidationError:
      type: object
      properties:
        detail:
          type: object
          properties:
            error:
              type: string
            error_code:
              type: string
              example: platform_validation_failed
            platform:
              $ref: '#/components/schemas/PublishPlatform'
            field:
              type: string
              example: title
            errors:
              type: array
              items:
                type: object
                properties:
                  platform:
                    type: string
                  field:
                    type: string
                  error:
                    type: string

    # ── Agent Core schemas ──────────────────────────────────
    # Flat schema — every field name mirrors the public Agent Core setup fields.
    AgentCore:
      type: object
      description: Full agent setup as returned by GET /agents/{id}/core.
      properties:
        agent_id: { type: string }
        brand_name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        identity_type: { type: string, enum: [brand, character], nullable: true }
        goal: { type: string, nullable: true, description: "Comma-separated, e.g. 'growth,authority,sales'" }
        target_platforms:
          type: array
          items: { type: string }
        shortform: { type: boolean, nullable: true }
        longform: { type: boolean, nullable: true }
        onboarding_status: { type: string, nullable: true }
        keywords:
          type: array
          items: { type: string }
          description: Flat keyword list used by the monitoring cron. Auto-mirrored into `monitored` on write.
        monitored:
          type: array
          items: { $ref: '#/components/schemas/MonitoredItem' }
          description: Inspiration sources — accounts, hashtags, or keywords the agent monitors for trending content.
        linked_accounts:
          type: array
          items: { $ref: '#/components/schemas/LinkedAccount' }
          description: The agent's OWN brand social links. NOT the same as `monitored` (which holds sources to watch).
        personality:
          type: string
          nullable: true
          description: Full persona text for the agent.
        default_user_voice:
          $ref: '#/components/schemas/VoiceRef'
        proof_of_genesis_enabled:
          type: boolean
          description: Master switch for automatic Backup to Blockchain from asset/vidsheet events.
        proof_of_genesis_auto_backup_sources:
          type: array
          description: Asset events that should trigger automatic Proof of Genesis backups.
          items:
            type: string
            enum: [generated, uploaded, downloaded, published]
        proof_of_genesis_auto_backup_asset_types:
          type: array
          description: Asset types eligible for automatic Proof of Genesis backup.
          items:
            type: string
            enum: [video, image]

    AgentCorePatch:
      type: object
      additionalProperties: false
      description: |
        Flat merge-patch body. Send any subset of fields — missing fields are not forwarded.
        Unknown fields return 422. `linked_accounts` and `monitored` use full-list replacement
        semantics: rows not in the list are deleted. To add without touching others, GET first,
        append, then PATCH.
      properties:
        brand_name: { type: string, maxLength: 200 }
        description:
          type: string
          maxLength: 500
          description: Short 2-3 sentence brand summary. NOT full persona — that goes in `personality`.
        identity_type: { type: string, enum: [brand, character] }
        goal: { type: string, maxLength: 100 }
        target_platforms:
          type: array
          items: { type: string }
          maxItems: 10
        shortform: { type: boolean }
        longform: { type: boolean }
        onboarding_status: { type: string, maxLength: 50 }
        keywords:
          type: array
          items: { type: string }
          maxItems: 20
          description: Flat keyword list. If set without `monitored`, auto-mirrored into monitored with item_type='keyword'.
        monitored:
          type: array
          items: { $ref: '#/components/schemas/MonitoredItem' }
          maxItems: 50
          description: Full inspiration source list (replaces the existing list).
        linked_accounts:
          type: array
          items: { $ref: '#/components/schemas/LinkedAccount' }
          maxItems: 20
        personality:
          type: string
          maxLength: 20000
          description: Full persona text for the agent.
        default_user_voice:
          $ref: '#/components/schemas/VoiceRef'
        proof_of_genesis_enabled:
          type: boolean
          description: Master switch for automatic Backup to Blockchain from asset/vidsheet events.
        proof_of_genesis_auto_backup_sources:
          type: array
          description: Replace the list of asset events that should trigger automatic Proof of Genesis backups. Empty means no automatic backup.
          items:
            type: string
            enum: [generated, uploaded, downloaded, published]
        proof_of_genesis_auto_backup_asset_types:
          type: array
          description: Replace the list of asset types eligible for automatic Proof of Genesis backup.
          items:
            type: string
            enum: [video, image]

    ProofOfGenesisBackupCreate:
      type: object
      description: Manual or event-triggered request to back up a GEN asset to Walrus.
      properties:
        asset_url:
          type: string
          description: GEN asset URL to back up. Preferred field.
        video_url:
          type: string
          description: Legacy alias for asset_url.
        asset_type:
          type: string
          enum: [video, image]
          default: video
        visibility:
          type: string
          enum: [private, public]
          default: private
          description: Private assets must be encrypted before upload. Raw private requests are rejected before billing or Walrus work.
        encrypted:
          type: boolean
          default: false
          description: Whether the asset bytes are already encrypted before Walrus upload. Required with encryption_scheme for private assets.
        encryption_scheme:
          type: string
          nullable: true
          maxLength: 128
          description: Required when visibility is private, e.g. seal/v1.
        encryption_key_id:
          type: string
          nullable: true
          maxLength: 256
          description: Optional key policy/version identifier for private proof metadata.
        owner_sui_address:
          type: string
          nullable: true
          description: Optional customer Sui wallet address that should own the Walrus object. Server-triggered auto-backup can resolve this from the user's Dynamic Sui wallet.
        source_event:
          type: string
          enum: [manual, generated, uploaded, downloaded, published]
          default: manual
        content_type:
          type: string
          nullable: true
        idempotency_key:
          type: string
          description: Stable retry key, e.g. content-resource id plus version.
        metadata:
          type: object
          additionalProperties: true
      anyOf:
        - required: [asset_url]
        - required: [video_url]

    ProofOfGenesisBackup:
      type: object
      properties:
        id: { type: integer }
        agent_id: { type: string }
        status: { type: string, enum: [uploading, synced, failed, billing_failed] }
        source_event: { type: string, enum: [manual, generated, uploaded, downloaded, published] }
        source_url: { type: string }
        asset_type: { type: string, enum: [video, image] }
        visibility: { type: string, enum: [private, public] }
        encrypted: { type: boolean }
        encryption_scheme: { type: string, nullable: true }
        encryption_key_id: { type: string, nullable: true }
        owner_sui_address: { type: string, nullable: true }
        custody_mode:
          type: string
          nullable: true
          enum: [gen_custody, customer_wallet, null]
          description: Whether GEN or the customer's Sui wallet owns the Walrus object.
        walrus_object_recipient_address:
          type: string
          nullable: true
          description: Sui address passed to Walrus send_object_to for customer-owned object transfer.
        content_sha256: { type: string, nullable: true }
        size_bytes: { type: integer, nullable: true }
        content_type: { type: string, nullable: true }
        walrus_blob_id: { type: string, nullable: true }
        walrus_blob_object_id: { type: string, nullable: true }
        walrus_storage_id: { type: string, nullable: true }
        walrus_start_epoch: { type: integer, nullable: true }
        walrus_end_epoch: { type: integer, nullable: true }
        walrus_encoded_length_bytes: { type: integer, nullable: true }
        walrus_cost_wal: { type: integer, nullable: true }
        verification_status: { type: string, nullable: true, enum: [verified, skipped, null] }
        billing_operation: { type: string, example: backup_to_blockchain }
        billing_charge_id: { type: integer, nullable: true }
        billing_amount_charged: { type: string, nullable: true }
        billing_new_balance: { type: string, nullable: true }
        billing_outboxed: { type: boolean }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Approximate Walrus expiry for the current monthly storage period.
        renewal_due_at:
          type: string
          format: date-time
          nullable: true
          description: When Agent Core should attempt monthly renewal, currently three days before expires_at.
        renewal_status:
          type: string
          description: Monthly renewal state for this backup.
          enum: [not_due, due, renewing, renewed, renewal_blocked, renewal_failed]
        renewal_attempts:
          type: integer
          description: Number of renewal attempts recorded by Agent Core.
        last_renewed_at:
          type: string
          format: date-time
          nullable: true
        failure_code: { type: string, nullable: true }
        failure_message: { type: string, nullable: true }
        removed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    ProofOfGenesisBackupList:
      type: object
      required: [backups]
      properties:
        backups:
          type: array
          items:
            $ref: '#/components/schemas/ProofOfGenesisBackup'

    MonitoredItem:
      type: object
      additionalProperties: false
      required: [handle, item_type]
      properties:
        handle:
          type: string
          minLength: 1
          maxLength: 300
          description: For accounts — a @handle or URL. For hashtags — the tag (with or without #). For keywords — the search term.
        item_type:
          type: string
          enum: [account, hashtag, keyword]

    LinkedAccount:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        id:
          type: integer
          description: Row id if updating an existing row. Omit when adding a new account.
        url: { type: string, minLength: 1, maxLength: 500 }
        platform:
          type: string
          maxLength: 50
          description: 'tiktok | instagram | youtube | x | linkedin | pinterest | facebook | threads | website | other'
        display_name: { type: string, maxLength: 200 }

    VoiceRef:
      type: object
      additionalProperties: false
      required: [voice_id]
      properties:
        voice_id: { type: string, minLength: 1, maxLength: 200 }
        source:
          type: string
          enum: [public, user_designed, user_trained, user_elevenlabs]
        name: { type: string, maxLength: 200 }

    AgentCorePatchResult:
      type: object
      description: |
        Per-section result. A PATCH to Agent Core may update multiple sections atomically.
        Section keys currently returned:
          - `brand` — brand fields (brand_name, description, identity_type, goal,
            target_platforms, shortform, longform, onboarding_status, keywords, monitored,
            linked_accounts). Clients should treat section keys as opaque strings.
          - `personality` — personality text.
          - `voice` — voice association.
        Each section appears only if the PATCH touched at least one field it owns.
        `status=ok` means that section succeeded. `status=error` means it failed
        (see `error` field). A 207 Multi-Status means at least one section errored.
      additionalProperties:
        type: object
        properties:
          status: { type: string, enum: [ok, error] }
          data:
            description: Target-specific payload on success.
          error:
            type: string
            description: Error message on failure.

    VoiceLibraryItem:
      type: object
      properties:
        voice_id: { type: string }
        name: { type: string, nullable: true }
        source: { type: string, enum: [public, user_designed, user_trained, user_elevenlabs] }
        preview_url: { type: string, nullable: true }

