        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PythonValidationError'
    patch:
      operationId: updateScheduledPost
      servers:
        - url: https://python.gen.pro
      x-mcp-tool: gen_publish_action
      x-mcp-branch: "update_scheduled_post"
      x-phase: [export]
      summary: Update a scheduled post before it goes out
      description: |
        Sparse update of the content fields, `scheduled_time` and `schedule_type`. Refused once the post has been sent or when it was created with `schedule_type: now`.
      tags: [Publishing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePostUpdate'
      responses:
        '200':
          description: The updated post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PythonValidationError'
    delete:
      operationId: deleteScheduledPost
      servers:
        - url: https://python.gen.pro
      x-mcp-tool: gen_publish_action
      x-mcp-branch: "delete_scheduled_post"
      x-phase: [export]
      summary: Delete a scheduled post
      tags: [Publishing]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                required:
                  - "message"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PythonValidationError'

  /schedule/post/{post_id}/published:
    parameters:
      - name: post_id
        in: path
        required: true
        description: The `post_id` of a post that has already published.
        schema:
          type: integer
    patch:
      operationId: updatePublishedPost
      servers:
        - url: https://python.gen.pro
      x-mcp-tool: gen_publish_action
      x-mcp-branch: "update_published_post"
      x-phase: [export]
      summary: Edit the metadata of a post that is already live
      description: |
        Change a published post's metadata where the destination network supports it — today, a YouTube video's `title`, `description`, `tags` and `category_id`. `GET /schedule/platforms` names the editable fields per platform in `editable_after_publish`.

        The edit is **sparse**: only the fields in the request body change. GEN reads the platform's current metadata, merges your change onto it, writes it back, and returns what the platform held afterwards — so a title you did not send is not cleared, and the same request sent twice converges on the same result rather than stacking edits.

        The response is `200` with one result per platform the post went out on, each `updated`, `unsupported_after_publish`, `reauthorization_required` or `failed`. A network with no edit path is reported as `unsupported_after_publish` and nothing is touched; it is never an authentication error. A `422` means the body itself is wrong — a field the platform cannot change after publishing, or one that breaks the platform's limits.

        Use `PATCH /schedule/post/{post_id}` for a post that has **not** gone out yet; that endpoint still refuses published posts.

        Each YouTube update consumes 50 units of the connected channel's YouTube API quota.
      tags: [Publishing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishedPostUpdate'
            examples:
              fixDescription:
                summary: Fix a typo in a live YouTube description
                value:
                  description: "What your $12 beauty sponge really costs — corrected sourcing figures in the pinned comment."
