  # ── Agent Core ────────────────────────────────────────────
  /agents/{agent_id}/core:
    get:
      operationId: getAgentCore
      x-phase: setup
      summary: Get the full agent setup
      description: |
        Returns the agent's full setup as a flat object whose field names mirror
        exactly what the GEN Setup canvas FE reads and writes. Merges brand
        setup, voice association, and personality into a single response — you
        get the whole agent in one call.
      tags: [Agent Core]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Full agent setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCore'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchAgentCore
      x-phase: setup
      summary: Update any combination of setup fields
      description: |
        Flat merge-patch. Send only the fields you want to change — missing
        fields are not forwarded. Field names map 1:1 to the GEN Setup canvas
        FE — no wrappers, no sections.

        **Field groups:**
        - Brand setup — `brand_name`, `description`, `identity_type`, `goal`,
          `keywords`, `monitored`, `target_platforms`, `shortform`, `longform`,
          `onboarding_status`, `linked_accounts`.
        - Personality — `personality` (full persona/backstory, max 20000 chars).
        - Voice — `default_user_voice`.

        **Guardrails:**
        - Unknown fields return 422 — typos fail fast.
        - `description` is capped at 500 chars. Full persona text belongs in
          `personality` (max 20000 chars).
        - `identity_type` is a strict enum: `"brand"` or `"character"`.
        - `monitored[].item_type` is a strict enum: `"account"`, `"hashtag"`,
          or `"keyword"`.

        **Semantics:** `linked_accounts` and `monitored` use full-list
        replacement. To add one row without touching others, read the current
        list via GET first, append, then PATCH.

        Returns 200 on full success, 207 Multi-Status with per-target results
        on partial failure. See `AgentCorePatchResult` for target keys.
      tags: [Agent Core]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCorePatch'
      responses:
        '200':
          description: All fields updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCorePatchResult'
        '207':
          description: Partial success — inspect per-target status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCorePatchResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Validation error — unknown field, bad enum, or length cap exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Agent Voice ───────────────────────────────────────────
  /agents/{agent_id}/proof-of-genesis/backups:
    get:
      operationId: listProofOfGenesisBackups
      x-phase: edit
      summary: List Proof of Genesis backups for an agent
      description: |
        Returns Proof of Genesis backup rows newest first. Removed rows are
        hidden by default; pass `include_removed=true` for audit views.
      tags: [Proof of Genesis]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - name: include_removed
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Backup list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofOfGenesisBackupList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProofOfGenesisBackup
      x-phase: edit
      summary: Back up an asset to Walrus
      description: |
        Creates a manual or event-triggered Proof of Genesis backup for an
        image or video asset. Agent Core checks credits before Walrus work and
        charges operation `backup_to_blockchain` after successful upload and
        readback verification.

        Walrus blobs are public by default. Public assets may be uploaded raw.
        Private assets must be encrypted before upload. Raw private requests
        are rejected before billing or Walrus work.
      tags: [Proof of Genesis]
      servers:
        - url: https://agent-core.gen.pro/v1
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofOfGenesisBackupCreate'
      responses:
        '201':
          description: Backup created or existing idempotent backup returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofOfGenesisBackup'
        '402':
          description: Insufficient credits or charge rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Proof of Genesis disabled or pricing not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

