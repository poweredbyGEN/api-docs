        Depths: `quick`, `default`, `deep`. This is a paid operation.

        **Base URL:** `https://agent.gen.pro/v1`
      tags: [Agent Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, agent_id]
              properties:
                topic:
                  type: string
                  example: "tariffs on beauty imports 2026"
                depth:
                  type: string
                  enum: [quick, default, deep]
                  default: default
                agent_id:
                  type: string
      responses:
        '202':
          description: Research run accepted
          content:
            application/json:
              schema:
                type: object
                required: [run_id, conversation_id, status]
                properties:
                  run_id:
                    type: string
                  conversation_id:
                    type: string
                  status:
                    type: string
                    example: running
                  progress_stream_url:
                    type: string
                    description: Opaque, run-specific URL for live progress updates. Treat as sensitive; or poll GET /agent/runs/{run_id} for an authenticated status path.
        '401':
