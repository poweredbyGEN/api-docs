  # ── Agent Profile ─────────────────────────────────────────
  /agent/run:
    post:
      operationId: startAgentRun
      servers:
        - url: https://agent.gen.pro/v1
      x-mcp-tool: gen_ask
      x-mcp-branch: "ask"
      x-phase: ideas
      summary: Start an agent run
      description: |
        Sends a message to the agent and starts a new run. Returns immediately with a run ID.
        Poll `GET /agent/runs/{run_id}` for status and messages, or use the returned progress path for live updates.

        **Base URL:** `https://agent.gen.pro/v1`

        **Querying a watchlist with typed filters.** The MCP `gen_query_watchlist`
        tool takes this same call as typed fields: it references a watchlist by
        id with a `@list:<watchlist_id>` token in `message` and lets you pass
        structured filters instead of
        hand-building a prompt. Example message:
        `"top 30 videos from @list:<watchlist_id> by engagement rate in the last 90 days"`.
        The chat layer parses the filters and applies them byte-identically
        across all of the watchlist's sources, and returns a `run_id` whose
        completed answer carries a video grid plus a summary. Supported typed
        filters: `question` (analysis kind — top videos / top hooks / top creators
        / trending music / comment themes), `days` (1-365), `limit` (1-1000),
        `sort_by` (`engagement_rate`, `watch_count`, `like_count`, `comment_count`,
        `share_count`, `save_count`, `posted_at`, `trending_score`),
        `min_engagement_rate` (0.0-1.0), and `return_all`. No silent caps: every
        stated filter is honored across every source; omitted filters fall to one
        default policy (`limit` → 100); out-of-range values return a clarifier.
      tags: [Agent Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, agent_id]
              properties:
                message:
                  type: string
                  description: The user's message to the agent.
                  example: "Generate 5 TikTok video ideas about morning routines"
                agent_id:
                  type: string
                  description: The agent to chat with.
                conversation_id:
                  type: string
                  description: Continue an existing conversation. Omit to start a new one.
                attachments:
                  type: array
                  items:
                    type: object
                  description: File attachments for the message.
                context:
                  type: object
                  description: Additional context for the agent.
                debug:
                  type: boolean
                  description: Enable debug mode for verbose logging.
      responses:
        '202':
          description: Run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  conversation_id:
                    type: string
                  status:
                    type: string
                    example: "running"
                  progress_stream_url:
                    type: string
                    description: Opaque, run-specific URL for live progress updates. Treat as sensitive; or poll GET /agent/runs/{run_id} for an authenticated status path.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid parameters or agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

